name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run tests
      run: mvn test

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # jib pushes both ghcr.io/erydberg/gokapp:${project.version} (from pom.xml)
    # and :latest, which is the tag compose.yaml deploys.
    - name: Build and push Docker image
      if: github.event_name != 'pull_request'
      run: mvn compile jib:build -Djib.to.tags=latest
