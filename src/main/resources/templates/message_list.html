<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Meddelanden</title>
    <th:insert th:replace="~{fragments :: metadata}"></th:insert>
    <script th:inline="javascript">
        /*<![CDATA[*/
        function confirmDelete(formId) {
            if (confirm("Vill du ta bort meddelandet? Även loggen över vilka som läst det tas bort.")) {
                document.getElementById(formId).submit();
            }
            return false;
        }
        /*]]>*/
    </script>
</head>
<body>
<div th:replace="~{fragments :: usermessages(${unreadMessages}, ${currentUrl})}"></div>

<div class="nav-box">
    <h1>Meddelanden</h1>
    <a th:href="@{/admin/message/new}">Nytt meddelande</a> |
    <a th:href="@{/admin}">Tillbaka</a>
</div>

<!-- Include messages -->
<div th:insert="~{fragments :: messages(${errormsg}, ${confirmmsg})}"></div>

<div class="notepad">
    <p th:if="${messages.isEmpty()}">Det finns inga meddelanden.</p>

    <table th:unless="${messages.isEmpty()}">
        <tr>
            <th>Rubrik</th>
            <th>Skapat</th>
            <th>Aktivt</th>
            <th>Läst av</th>
            <th></th>
        </tr>
        <tr th:each="message,iterStat : ${messages}">
            <td>
                <a th:href="@{/admin/message/{id}(id=${message.id})}"
                   th:text="${message.title}">Rubrik</a>
            </td>
            <td th:text="${#temporals.format(message.created, 'yyyy-MM-dd HH:mm', 'Europe/Stockholm')}">Datum</td>
            <td th:text="${message.active} ? 'Ja' : 'Nej'">Ja</td>
            <td>
                <a th:href="@{/admin/message/{id}/readers(id=${message.id})}"
                   th:text="${readCounts[message.id]} + ' av ' + ${userCount}">0 av 0</a>
            </td>
            <td>
                <!-- Delete form -->
                <form th:id="'deleteForm-' + ${iterStat.index}"
                      th:action="@{/admin/message/{id}/delete(id=${message.id})}"
                      method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <a href="#"
                       class="del"
                       th:onclick="'return confirmDelete(\'deleteForm-' + ${iterStat.index} + '\');'">
                        <img th:src="@{/css/delete.png}" alt="Radera"/>
                    </a>
                </form>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
